[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaprofile-control-plane"
version = "1.0.0"
description = "NOVA Profile Engine & Control Plane -- Android fingerprint profile management"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "psutil>=5.9",
    "aiohttp>=3.9",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest-cov>=5.0"]

[project.scripts]
nova = "novaprofile.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["novaprofile*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# UP042: the enums deliberately inherit from ``str`` rather than using
# ``StrEnum`` so that they stay JSON-serialisable by value and comparable
# against plain strings across the whole codebase.
ignore = ["N805", "N815", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
