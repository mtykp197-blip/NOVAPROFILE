<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    />
    <title>NOVA PROFILE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The shell. -->
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/nova-logo-256.png" alt="NOVA" class="brand-mark" />
        <div class="brand-text">
          <strong>NOVA PROFILE</strong>
          <span>Anti-collision profile engine</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item is-active" data-view="profiles">
          <span class="nav-icon">◈</span> Profiles
        </button>
        <button class="nav-item" data-view="fleet">
          <span class="nav-icon">⊞</span> Fleet
        </button>
        <button class="nav-item" data-view="presets">
          <span class="nav-icon">▤</span> Devices
        </button>
        <button class="nav-item" data-view="proxies">
          <span class="nav-icon">⇄</span> Proxies
        </button>
        <button class="nav-item" data-view="audit">
          <span class="nav-icon">✓</span> Audit
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon">⚙</span> Settings
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="status" id="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">Connecting…</span>
        </div>
        <div class="version" id="version">—</div>
      </div>
    </aside>

    <!-- The work area. -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">Profiles</h1>
          <p class="subtitle" id="view-subtitle">Every profile is a different person.</p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <div class="content" id="content">
        <div class="loading">
          <div class="spinner"></div>
          <p>Waking the control plane…</p>
        </div>
      </div>
    </main>

    <!-- The modal the operator's forms appear in. -->
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal" id="modal">
        <header class="modal-head">
          <h2 id="modal-title">—</h2>
          <button class="icon-button" id="modal-close" aria-label="Close">✕</button>
        </header>
        <div class="modal-body" id="modal-body"></div>
        <footer class="modal-foot" id="modal-foot"></footer>
      </div>
    </div>

    <!-- The toast area. -->
    <div class="toasts" id="toasts"></div>

    <script src="app.js"></script>
  </body>
</html>
