name: CI

# The pipeline runs on every push and on every pull request.  The
# expensive jobs -- the Chromium build and the installer -- only run
# when the change touches the files they depend on, so that a change to
# a single probe script does not queue two hours of compilation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same branch cancels the previous run.  The work
  # is the same, so running it twice wastes the runner minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # -- the fast gate ------------------------------------------------------
  #
  # Linting and the unit tests.  This is the job that has to pass for
  # anything else to be worth running.
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: novaprofile/control_plane/pyproject.toml

      - name: Install the control plane
        working-directory: novaprofile/control_plane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-timeout

      - name: Ruff
        working-directory: novaprofile/control_plane
        run: python -m ruff check . --output-format=concise

      - name: Ruff format check
        working-directory: novaprofile/control_plane
        run: python -m ruff format --check .

      - name: Unit tests
        working-directory: novaprofile/control_plane
        run: python -m pytest -q --timeout=600

      - name: The patch series still applies
        working-directory: novaprofile/control_plane
        run: python -m pytest -q tests/test_core_patch_build.py

  # -- the product --------------------------------------------------------
  #
  # The installer is built on every push to main.  It produces a
  # portable directory that can be unpacked anywhere, so the artefact
  # is a tarball rather than an installer package.
  build-installer:
    name: Build the installer
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the control plane
        working-directory: novaprofile/control_plane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build the installation
        working-directory: novaprofile/control_plane
        run: python -m novaprofile.installer.builder --output "$RUNNER_TEMP/dist"

      - name: Upload the installation
        uses: actions/upload-artifact@v4
        with:
          name: novaprofile-installation
          path: ${{ runner.temp }}/dist
          retention-days: 14

  # -- the core -----------------------------------------------------------
  #
  # The native core is built from the patch series against a real
  # Chromium checkout.  The job is gated on the files that decide what
  # the binary contains: a change to a probe script cannot change the
  # binary, so it does not queue this job.
  build-core:
    name: Build the native core
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 360
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[core]') ||
      contains(github.event.pull_request.title, '[core]')
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The Chromium checkout is 23 GB and the patch series is
          # applied to it, so the history is needed to produce the diff.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the tooling
        working-directory: novaprofile/control_plane
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check out Chromium
        run: |
          git clone --depth 1 --branch "$CHROMIUM_BRANCH" \
            https://chromium.googlesource.com/chromium/src.git chromium
        env:
          CHROMIUM_BRANCH: "refs/branch-heads/8177"

      - name: Apply the patch series
        run: |
          python novaprofile/core_patch/build.py apply \
            --version 160 \
            --checkout "$GITHUB_WORKSPACE/chromium"

      - name: Configure and build
        working-directory: chromium
        run: |
          ./tools/gn/bootstrap/bootstrap.py
          out=$(./tools/gn/gn gen out/Default --args='target_os="linux" target_cpu="x64" is_debug=false')
          echo "gn gen -> $out"
          autoninja -C out/Default chrome

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: novaprofile-core-linux
          path: chromium/out/Default/chrome
          retention-days: 7
